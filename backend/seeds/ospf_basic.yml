name: "OSPF 基础测试拓扑"
description: "3 台路由器组成的三角形拓扑，用于 OSPF 基础功能测试"
version: "1.0"

# 设备定义
devices:
  - name: R1
    type: router              # router / switch / tester / ...
    model: NE40E              # 设备型号
    management-ip: 10.10.10.1

  - name: R2
    type: router
    model: NE40E
    management-ip: 10.10.10.2

  - name: R3
    type: router
    model: NE40E
    management-ip: 10.10.10.3

# 互联关系
links:
  - endpoints:
      - device: R1
        interface: GE0/0/1
        ip: 10.1.1.1/30
      - device: R2
        interface: GE0/0/1
        ip: 10.1.1.2/30
    description: "R1-R2 互联"

  - endpoints:
      - device: R1
        interface: GE0/0/2
        ip: 10.1.2.1/30
      - device: R3
        interface: GE0/0/1
        ip: 10.1.2.2/30
    description: "R1-R3 互联"

  - endpoints:
      - device: R2
        interface: GE0/0/2
        ip: 10.1.3.1/30
      - device: R3
        interface: GE0/0/2
        ip: 10.1.3.2/30
    description: "R2-R3 互联"